  <text x="150" y="316" font-size="15" fill="#9db9ca">news · documents · events</text>
  <text x="150" y="338" font-size="15" fill="#9db9ca">structured / unstructured data</text>

  <text x="150" y="441" font-size="21" font-weight="800">RAG &amp; Retrieval</text>
  <text x="150" y="471" font-size="15" fill="#9db9ca">context construction</text>
  <text x="150" y="493" font-size="15" fill="#9db9ca">grounded generation</text>

  <text x="150" y="596" font-size="21" font-weight="800">Agent / Model</text>
  <text x="150" y="626" font-size="15" fill="#9db9ca">reasoning · planning · tools</text>
  <text x="150" y="648" font-size="15" fill="#9db9ca">capability proposal</text>

  <text x="505" y="286" font-size="21" font-weight="800">Policy Engine</text>
