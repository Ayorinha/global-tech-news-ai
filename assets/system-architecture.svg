  <text x="505" y="338" font-size="15" fill="#9db9ca">allow · deny · review</text>

  <text x="505" y="441" font-size="21" font-weight="800">Authorization</text>
  <text x="505" y="471" font-size="15" fill="#9db9ca">least privilege</text>
  <text x="505" y="493" font-size="15" fill="#9db9ca">scope · identity · provenance</text>

  <text x="505" y="596" font-size="21" font-weight="800">Validation</text>
  <text x="505" y="626" font-size="15" fill="#9db9ca">schema · freshness · replay</text>
  <text x="505" y="648" font-size="15" fill="#9db9ca">security regression tests</text>

  <text x="895" y="286" font-size="21" font-weight="800">Approval Gate</text>
