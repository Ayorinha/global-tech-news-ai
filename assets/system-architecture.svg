  <text x="895" y="338" font-size="15" fill="#9db9ca">high-impact actions</text>

  <text x="895" y="441" font-size="21" font-weight="800">Execution Boundary</text>
  <text x="895" y="471" font-size="15" fill="#9db9ca">MCP / APIs / tools</text>
  <text x="895" y="493" font-size="15" fill="#9db9ca">controlled side effects</text>

  <text x="895" y="596" font-size="21" font-weight="800">Recovery</text>
  <text x="895" y="626" font-size="15" fill="#9db9ca">quarantine · rollback</text>
  <text x="895" y="648" font-size="15" fill="#9db9ca">failure containment</text>

  <text x="1245" y="286" font-size="21" font-weight="800">Audit Trail</text>
  <text x="1245" y="316" font-size="15" fill="#9db9ca">events · decisions</text>
  <text x="1245" y="338" font-size="15" fill="#9db9ca">evidence · traceability</text>

  <text x="1245" y="441" font-size="21" font-weight="800">Observability</text>
  <text x="1245" y="471" font-size="15" fill="#9db9ca">metrics · traces · logs</text>
  <text x="1245" y="493" font-size="15" fill="#9db9ca">evaluation evidence</text>

  <text x="1245" y="596" font-size="21" font-weight="800">Research / CI</text>
  <text x="1245" y="626" font-size="15" fill="#9db9ca">benchmarks · regression</text>
  <text x="1245" y="648" font-size="15" fill="#9db9ca">reproducible workflows</text>
