name: Iorai Security Benchmark

on:
  push:
    branches: [main]
    paths:
      - "security-shield.js"
      - "security-benchmark.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/iorai-security-benchmark.yml"
  pull_request:
    paths:
      - "security-shield.js"
      - "security-benchmark.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/iorai-security-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Iorai Security Benchmark
        run: npm run security:test
