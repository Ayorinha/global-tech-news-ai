name: Secure Agent Tests

on:
  pull_request:
    paths:
      - "labs/ayorai-secure-operations-agent/**"
      - ".github/workflows/secure-agent-tests.yml"
  push:
    branches: [main]
    paths:
      - "labs/ayorai-secure-operations-agent/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/ayorai-secure-operations-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
