name: Shield Research Lab CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  security-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run security:test
