name: Agent Defense Lab

on:
  push:
    paths:
      - 'labs/ayorai-agent-defense-lab/**'
  pull_request:
    paths:
      - 'labs/ayorai-agent-defense-lab/**'

jobs:
  security-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/ayorai-agent-defense-lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m app.cli
