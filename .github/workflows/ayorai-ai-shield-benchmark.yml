name: AYORAI AI Shield Benchmark

on:
  push:
    branches: [main]
    paths: ["security-shield.js","security-benchmark.js","tests/**","package.json",".github/workflows/ayorai-ai-shield-benchmark.yml"]
  pull_request:
    paths: ["security-shield.js","security-benchmark.js","tests/**","package.json",".github/workflows/ayorai-ai-shield-benchmark.yml"]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run AYORAI AI Shield regression
        run: npm run security:test
