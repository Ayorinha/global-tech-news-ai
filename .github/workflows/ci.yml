name: Portfolio CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q scripts

      - name: Validate JSON datasets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("data").rglob("*.json"):
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK {path}")
          PY

      - name: Run available tests
        shell: bash
        run: |
          if find . -maxdepth 3 -type f -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            python -m pytest -q
          else
            echo "No Python test suite present; syntax and data validation completed."
          fi
