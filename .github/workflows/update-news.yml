name: Atualizar Noticias

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "data/news.json"
  workflow_dispatch:

# Evita execucoes concorrentes e impede que o proprio commit de news.json
# dispare uma nova coleta em loop.
concurrency:
  group: atualizar-noticias-main
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    name: Coletar Noticias e Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install feedparser requests deep-translator

      - name: Sincronizar com main antes da coleta
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Coletar e traduzir noticias
        run: python scripts/fetch_news.py

      - name: Validar referencias tecnicas
        run: python scripts/enrich_technical_refs.py

      - name: Validar news.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/news.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("news.json precisa ser uma lista JSON")
          if not data:
              raise SystemExit("news.json ficou vazio; preservando a versao anterior")
          required = {"title_pt", "link", "source", "published", "language"}
          bad = [i for i, item in enumerate(data) if not required.issubset(item)]
          if bad:
              raise SystemExit(f"Noticias invalidas nas posicoes: {bad[:10]}")
          print(f"OK: {len(data)} noticias validas")
          PY

      - name: Commitar e publicar news.json
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca para commitar."
          else
            git commit -m "chore: atualizar noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
