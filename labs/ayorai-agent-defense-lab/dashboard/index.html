<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AyorAI Agent Defense Lab</title><style>body{margin:0;background:#08111f;color:#e8f0f7;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:42px 20px}h1{font-size:42px;margin:0 0 8px}p{color:#9fb1c2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:28px 0}.card{background:#101d2d;border:1px solid #22364d;border-radius:14px;padding:20px}.value{font-size:30px;font-weight:800}.label{color:#9fb1c2;margin-top:5px}.actions{display:flex;gap:10px;margin:20px 0}button{border:0;border-radius:9px;padding:11px 16px;background:#35d0ba;color:#06111b;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;background:#050b13;border:1px solid #22364d;padding:18px;border-radius:12px;overflow:auto}.pill{display:inline-block;border:1px solid #29435e;border-radius:99px;padding:5px 9px;color:#8fded3}</style></head><body><main><span class="pill">SANDBOX · SYNTHETIC DATA ONLY</span><h1>AyorAI Agent Defense Lab</h1><p>Red Agent → Sandbox → Blue Agent → Evaluation</p><div class="actions"><button onclick="run()">Run benchmark</button></div><section class="grid"><div class="card"><div id="total" class="value">—</div><div class="label">Scenarios</div></div><div class="card"><div id="detect" class="value">—</div><div class="label">Detection rate</div></div><div class="card"><div id="block" class="value">—</div><div class="label">Containment rate</div></div><div class="card"><div id="leak" class="value">—</div><div class="label">Sensitive-data leakage</div></div><div class="card"><div id="score" class="value">—</div><div class="label">Average score</div></div></div><h2>Evaluation trace</h2><pre id="out">Run the benchmark to generate a local evaluation.</pre></section></main><script>async function run(){const r=await fetch('/benchmark',{method:'POST'});const d=await r.json();document.querySelector('#total').textContent=d.total_scenarios;document.querySelector('#detect').textContent=d.detection_rate+'%';document.querySelector('#block').textContent=d.containment_rate+'%';document.querySelector('#leak').textContent=d.sensitive_data_leakage_rate+'%';document.querySelector('#score').textContent=d.average_score;document.querySelector('#out').textContent=JSON.stringify(d.evaluations,null,2)}</script></body></html>
